name:  Build release

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  MAJOR_MINOR: "0.1"

jobs:
  # ============================================================
  # 版本计算
  # ============================================================
  versioning:
    name: Calculate Version & Create Tag
    runs-on: ubuntu-latest
    outputs:
      full_version: ${{ steps.version.outputs.full_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_title: ${{ steps.version.outputs.release_title }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate new version
        id: version
        run: |
          BASE_VERSION="${{ env.MAJOR_MINOR }}"
          DATE_SUFFIX=$(date +'%Y%m%d')
          PATTERN="v${BASE_VERSION}."
          
          LATEST_PATCH=$(git tag -l "${PATTERN}*" | \
                         grep "${DATE_SUFFIX}$" | \
                         sed -n "s/^${PATTERN}\([0-9]*\)-${DATE_SUFFIX}$/\1/p" | \
                         sort -n | \
                         tail -1)
          
          if [ -z "$LATEST_PATCH" ]; then
            NEW_PATCH=0
          else
            NEW_PATCH=$((LATEST_PATCH + 1))
          fi
          
          FULL_VERSION="${BASE_VERSION}.${NEW_PATCH}"
          TAG_NAME="v${FULL_VERSION}-${DATE_SUFFIX}"
          
          echo "full_version=${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=Release ${FULL_VERSION} (${DATE_SUFFIX})" >> $GITHUB_OUTPUT
          
          echo "=========================================="
          echo "  Base version:   ${BASE_VERSION}"
          echo "  Latest patch:   ${LATEST_PATCH:-none}"
          echo "  New patch:      ${NEW_PATCH}"
          echo "  Tag name:       ${TAG_NAME}"
          echo "=========================================="

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.version.outputs.tag_name }}"
          
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "⚠️  Tag $TAG already exists, skipping creation"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "✅ Tag $TAG created and pushed"
          fi

  # ============================================================
  # 跨平台编译
  # ============================================================
  build-cross-platform:
    name: Build ${{ matrix.target }}
    needs: versioning
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- Linux (MUSL 静态编译) ----------
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_ext: ''
            rustup_toolchain: stable
            features: ""
            env:
              RUSTFLAGS: ""

          # ---------- Windows (GNU 静态链接) ----------
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            artifact_ext: .exe
            rustup_toolchain: stable-gnu
            # Windows 需要额外启用 kio-rs/tokio
            features: "kio-rs/tokio"
            env:
              # 启用静态链接，生成独立的 .exe
              RUSTFLAGS: "-C target-feature=+crt-static"

    env: ${{ matrix.env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rustup_toolchain }}
          targets: ${{ matrix.target }}

      # ---------- Windows GNU 工具链需要安装 MinGW ----------
      - name: Setup MinGW (for Windows GNU target)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-toolchain

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Install musl-tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # ---------- 调试：查看依赖树 ----------
      - name: Debug dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "=== Dependency tree (filtering pprof) ==="
          cargo tree | grep -E "(pprof|kpprof)" || echo "No pprof dependencies found"
          echo "=== Features enabled ==="
          cargo tree -e features | grep -E "(pprof|kpprof)" || echo "No pprof features found"
        shell: bash

      - name: Build (Release)
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            echo "Building with features: ${{ matrix.features }}"
            cargo build --release --target ${{ matrix.target }} --features "${{ matrix.features }}"
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      # ---------- 验证生成的二进制文件 ----------
      - name: Verify binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          BINARY_PATH="target/${{ matrix.target }}/release/kcptun-client${{ matrix.artifact_ext }}"
          if [ -f "$BINARY_PATH" ]; then
            echo "✅ Binary found: $BINARY_PATH"
            echo "=== Binary size ==="
            ls -lh "$BINARY_PATH"
            echo "=== Checking dependencies (using objdump) ==="
            # 使用 objdump 检查依赖的 DLL
            objdump -p "$BINARY_PATH" | grep "DLL Name" || echo "No external DLL dependencies found (likely static linked)"
          else
            echo "❌ Binary not found!"
            exit 1
          fi
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kcptun-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/kcptun-*${{ matrix.artifact_ext }}
          retention-days: 30

  # ============================================================
  # OpenWrt 编译
  # ============================================================
  build-openwrt:
    name: Build OpenWrt (x86-64)
    needs: versioning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file \
            g++ gawk gettext git java-propose-classpath libelf-dev \
            libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev \
            python3-pip unzip wget zlib1g-dev

      - name: Clone OpenWrt source
        run: |
          git clone https://github.com/coolsnowwolf/lede openwrt
          cd openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate config
        run: |
          cd openwrt
          
          if [ -f ../.config ]; then
            echo "Using existing .config from repository"
            cp ../.config .config
          else
            echo "Generating default .config for x86-64"
            cat > .config << 'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget=y
          EOF
            make defconfig
          fi

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-firmware
          path: |
            openwrt/bin/targets/x86/64/*.img.gz
            openwrt/bin/targets/x86/64/*.vmdk
          retention-days: 30

  # ============================================================
  # 创建 Release
  # ============================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [versioning, build-cross-platform, build-openwrt]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts (for debugging)
        run: |
          echo "=== Downloaded artifacts ==="
          ls -la artifacts/
          find artifacts/ -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.versioning.outputs.tag_name }}
          name: ${{ needs.versioning.outputs.release_title }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/**/kcptun-*
            artifacts/**/*.img.gz
            artifacts/**/*.vmdk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
